<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060C">
  <meta name="apple-mobile-web-app-title" content="Tuner">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Tuner">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Tuner — radio et console audio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
<title>Tuner</title>
<style>
  :root{
    --void:#05060C; --deep:#080B14; --panel:#0C1020; --mod:#0A0E1A;
    --edge:rgba(140,170,255,.13); --edge2:rgba(140,170,255,.24);
    --cyan:#2FE7FF; --magenta:#FF3D9E; --lime:#B9FF45; --amber:#FFC24B;
    --ice:#EAF1FF; --muted:#8090B8;
    --e:cubic-bezier(.32,.72,0,1);
    --scopeH:30vh;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(70% 44% at 10% -6%,rgba(47,231,255,.13),transparent 62%),
               radial-gradient(64% 42% at 94% 2%,rgba(255,61,158,.11),transparent 60%),var(--void);
    background-attachment:fixed;color:var(--ice);position:relative;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  }
  body::before{content:"";position:fixed;inset:-30%;pointer-events:none;z-index:-1;
    background:radial-gradient(38% 30% at 30% 30%,rgba(47,231,255,.12),transparent 60%),
               radial-gradient(34% 28% at 72% 62%,rgba(255,61,158,.10),transparent 62%),
               radial-gradient(30% 26% at 52% 88%,rgba(185,255,69,.07),transparent 60%);
    animation:aurora 26s ease-in-out infinite alternate;filter:blur(30px)}
  @keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(3%,-2%,0) scale(1.08)}
    100%{transform:translate3d(-3%,2%,0) scale(1.04)}}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
         touch-action:manipulation;-webkit-user-select:none;user-select:none}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:10px}

  .app{max-width:1700px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
       padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px)
               calc(env(safe-area-inset-bottom) + 104px) calc(env(safe-area-inset-left) + 14px)}
  .card{border:1px solid var(--edge);border-radius:20px;position:relative;
        background:linear-gradient(180deg,rgba(47,231,255,.05),transparent 40%),
                   linear-gradient(180deg,var(--panel),var(--deep));
        box-shadow:0 0 0 1px rgba(47,231,255,.06) inset,0 0 34px rgba(47,231,255,.09),
                   0 20px 60px rgba(0,0,0,.55)}

  .topbar{display:flex;align-items:center;gap:16px;padding:14px 18px;flex-wrap:wrap}
  .tb-txt{flex:1;min-width:180px}
  .eyebrow{font-size:10.5px;color:var(--cyan);letter-spacing:.22em;
           text-shadow:0 0 16px rgba(47,231,255,.55)}
  .now{font-size:clamp(20px,2.6vw,28px);font-weight:600;line-height:1.15;letter-spacing:-.035em;
       margin:3px 0 2px;text-shadow:0 0 34px rgba(140,190,255,.28);
       transition:opacity .38s var(--e),transform .38s var(--e)}
  .now.swap{opacity:0;transform:translateY(-8px)}
  .sub{font-size:13px;color:var(--muted);min-height:19px;transition:color .35s var(--e)}
  .sub.live{color:var(--lime);text-shadow:0 0 16px rgba(185,255,69,.45)}
  .track{font-size:13.5px;font-weight:600;color:var(--cyan);opacity:.9;margin:0 0 2px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none;
         text-shadow:0 0 14px rgba(47,231,255,.4)}
  .track.show{display:block}
  .track::before{content:"♫ "}

  .top5{padding:14px 16px}
  .top5-list{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .top5-list::-webkit-scrollbar{display:none}
  .t5{flex:none;display:flex;align-items:center;gap:9px;border:1px solid var(--edge2);
      border-radius:14px;background:var(--mod);padding:9px 14px;min-width:150px;
      transition:all .2s var(--e)}
  .t5:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(47,231,255,.18)}
  .t5.play{border-color:var(--cyan);box-shadow:0 0 18px rgba(47,231,255,.25)}
  .t5 .rk{font-size:15px;font-weight:800;color:var(--magenta);flex:none}
  .t5 .t5t{min-width:0;text-align:left}
  .t5 .t5n{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;max-width:130px}
  .t5 .t5c{font-size:11px;color:var(--muted)}
  .wave{display:flex;align-items:flex-end;gap:2px;height:34px;width:150px;flex:none}
  .wave i{flex:1;border-radius:3px;height:3px;background:linear-gradient(180deg,var(--cyan),rgba(47,231,255,.12));
          box-shadow:0 0 10px rgba(47,231,255,.45);opacity:.28;
          transition:height .08s linear,opacity .6s var(--e)}
  .wave.on i{opacity:1}
  .tb-btns{display:flex;gap:9px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;justify-content:center;border-radius:100px;
        min-height:52px;padding:0 26px;font-size:15px;font-weight:600;
        background:linear-gradient(135deg,var(--cyan),#0E8BDD);color:#03121A;
        box-shadow:0 0 26px rgba(47,231,255,.35);
        transition:transform .18s var(--e),filter .22s var(--e),box-shadow .22s var(--e)}
  .pill:active{transform:scale(.97)}
  .pill.ghost{background:rgba(234,241,255,.06);color:var(--ice);
              border:1px solid var(--edge2);box-shadow:none}

  .scope-card{padding:14px 14px 10px;overflow:hidden}
  .scope-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
              flex-wrap:wrap;gap:10px}
  .scope-head h2{font-size:11.5px;letter-spacing:.2em;margin:0;opacity:.8}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:18px;height:3px;border-radius:2px;
            vertical-align:middle;margin-right:7px}
  .scope-card::after{content:"";position:absolute;top:0;bottom:0;width:34%;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(47,231,255,.07),transparent);
    animation:sweep 7s linear infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
  canvas{display:block;width:100%;height:var(--scopeH);min-height:150px;border-radius:14px;
         border:1px solid rgba(47,231,255,.2);
         background:radial-gradient(75% 130% at 50% 50%,#0B1426,#05060C);
         box-shadow:0 0 30px rgba(47,231,255,.14) inset,0 0 26px rgba(47,231,255,.1)}

  .grip{height:16px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;
        touch-action:none;flex:none}
  .grip i{width:80px;height:4px;border-radius:99px;background:rgba(140,190,255,.22);
          box-shadow:0 0 14px rgba(47,231,255,.35);transition:all .2s var(--e)}
  .grip:hover i,.grip.drag i{width:130px;background:var(--cyan);box-shadow:0 0 20px var(--cyan)}

  .console{padding:18px}
  .ctitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  .ctitle h2{font-size:11.5px;letter-spacing:.2em;margin:0;color:var(--cyan);
             text-shadow:0 0 16px rgba(47,231,255,.5)}
  .ctitle button{font-size:13px;color:var(--muted);border:1px solid var(--edge);
                 border-radius:100px;min-height:40px;padding:0 18px;transition:all .22s var(--e)}
  .ctitle button.on{color:#03121A;background:var(--cyan);border-color:transparent;font-weight:700;
                    box-shadow:0 0 22px rgba(47,231,255,.45)}
  .gainbox{border:1px solid rgba(47,231,255,.28);border-radius:18px;background:var(--mod);
           padding:16px 18px 12px;margin-bottom:12px;
           box-shadow:0 0 30px rgba(47,231,255,.13) inset,0 0 24px rgba(47,231,255,.1);
           display:grid;grid-template-columns:1fr;gap:14px;align-items:center}
  .gainhead{display:flex;align-items:baseline;justify-content:space-between}
  .gainhead .lbl{font-size:17px;font-weight:600;transition:color .2s var(--e),text-shadow .2s var(--e)}
  .gainhead .val{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--cyan);
                 text-shadow:0 0 20px rgba(47,231,255,.45);transition:color .2s var(--e),text-shadow .2s var(--e)}
  .gainhead.active .lbl{color:var(--cyan);text-shadow:0 0 12px rgba(47,231,255,.6)}
  .gainhead.active .val{color:var(--cyan);text-shadow:0 0 24px rgba(47,231,255,.7)}
  .big{height:56px!important}
  .big::-webkit-slider-runnable-track{height:10px!important;border-radius:99px}
  .big::-webkit-slider-thumb{width:40px!important;height:40px!important;margin-top:-15px!important}
  .vu{display:flex;flex-direction:column;gap:7px}
  .vu2{display:flex;align-items:center;gap:9px;width:100%}
  .vu2lbl{font-size:11px;font-weight:700;color:var(--muted);width:13px;text-align:center;flex:none}
  .vu2mid{width:1px;align-self:stretch;background:var(--edge2);flex:none}
  .vubar{flex:1;display:flex;gap:2px;height:16px}
  .vubar.rev{flex-direction:row-reverse}
  .chvol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;
         padding-top:14px;border-top:1px solid var(--edge2)}
  .vubar i{flex:1;border-radius:2px;background:rgba(234,241,255,.07);
           transition:background .07s linear,box-shadow .07s linear}
  .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;
        margin-top:12px;padding-top:12px;border-top:1px solid var(--edge2)}
  .mod{border:1px solid var(--edge);border-radius:18px;background:var(--mod);padding:16px 15px;
       box-shadow:0 0 20px rgba(47,231,255,.06) inset;transition:box-shadow .3s var(--e),border-color .3s var(--e)}
  .mod:hover{box-shadow:0 0 26px rgba(47,231,255,.13) inset}
  .mod.active{border-color:var(--mod-c,var(--cyan));
              box-shadow:0 0 28px color-mix(in srgb,var(--mod-c,var(--cyan)) 28%,transparent),
                         inset 0 0 20px color-mix(in srgb,var(--mod-c,var(--cyan)) 8%,transparent)}
  .mod h3{font-size:11px;letter-spacing:.18em;margin:0 0 12px;color:var(--ice);opacity:.8;
          text-shadow:0 0 14px rgba(140,190,255,.45);transition:color .2s var(--e),opacity .2s var(--e),text-shadow .2s var(--e)}
  .mod.active h3{color:var(--mod-c,var(--cyan));opacity:1;text-shadow:0 0 14px var(--mod-c,var(--cyan))}
  .fhead .lbl{font-size:15px;font-weight:600;text-shadow:0 0 12px rgba(140,190,255,.28);
              transition:color .2s var(--e),text-shadow .2s var(--e)}
  .mod.active .fhead .lbl{color:var(--mod-c,var(--cyan));text-shadow:0 0 10px var(--mod-c,var(--cyan))}
  .fhead .val{font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);
              transition:color .2s var(--e)}
  .mod.active .fhead .val{color:var(--mod-c,var(--cyan))}
  .fader{margin-top:14px}
  .fader:first-of-type{margin-top:0}
  .chvol .fader{margin-top:0;border-radius:14px;padding:8px 8px 4px;
                 transition:background .2s var(--e),box-shadow .2s var(--e)}
  .chvol .fader.active{background:color-mix(in srgb,var(--fader-c,var(--cyan)) 9%,transparent);
    box-shadow:0 0 22px color-mix(in srgb,var(--fader-c,var(--cyan)) 35%,transparent),
               inset 0 0 16px color-mix(in srgb,var(--fader-c,var(--cyan)) 10%,transparent)}
  .fhead.right{flex-direction:row-reverse}
  .fhead{display:flex;justify-content:space-between;align-items:baseline}
  .fhead .lbl{font-size:15px;font-weight:600;text-shadow:0 0 12px rgba(140,190,255,.28);
              transition:color .2s var(--e),text-shadow .2s var(--e)}
  .fhead .val{font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);
              transition:color .2s var(--e)}
  .chvol .fader.active .fhead .lbl{color:var(--fader-c,var(--cyan));text-shadow:0 0 10px var(--fader-c,var(--cyan))}
  .chvol .fader.active .fhead .val{color:var(--fader-c,var(--cyan));text-shadow:0 0 12px var(--fader-c,var(--cyan))}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;
                    background:transparent;margin:0;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:99px;
    background:linear-gradient(90deg,var(--c,var(--cyan)) var(--p,50%),rgba(234,241,255,.1) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:32px;height:32px;border-radius:50%;margin-top:-13px;background:#fff;
    border:2px solid var(--c,var(--cyan));box-shadow:0 0 18px var(--c,var(--cyan)),0 3px 10px rgba(0,0,0,.5);
    transition:transform .16s var(--e)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14)}
  input[type=range].mirror{direction:rtl}
  input[type=range].mirror::-webkit-slider-runnable-track{
    background:linear-gradient(270deg,var(--c,var(--cyan)) var(--p,50%),rgba(234,241,255,.1) var(--p,50%))}
  input[type=range]::-moz-range-track{height:7px;border-radius:99px;background:rgba(234,241,255,.1)}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;
    border:2px solid var(--c,var(--cyan));box-shadow:0 0 16px var(--c,var(--cyan))}
  select,.txtin{width:100%;font:inherit;font-size:15px;color:var(--ice);
    background:rgba(234,241,255,.05);border:1px solid var(--edge2);border-radius:12px;
    min-height:48px;padding:0 14px;-webkit-appearance:none;appearance:none;
    transition:border-color .22s var(--e)}
  select:focus,.txtin:focus{outline:none;border-color:var(--cyan)}
  .led{width:18px;height:18px;border-radius:50%;background:#26060F;border:1px solid #4A1226;
       margin-top:8px;transition:background .08s linear,box-shadow .08s linear}
  .led.hot{background:var(--magenta);box-shadow:0 0 18px var(--magenta)}
  .modes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .modes button{flex:1;min-width:110px;background:rgba(234,241,255,.05);border:1px solid var(--edge);
    border-radius:100px;min-height:48px;font-size:14px;color:var(--muted);transition:all .22s var(--e)}
  .modes button.sel{background:linear-gradient(135deg,var(--magenta),#B01E75);color:#fff;
    border-color:transparent;font-weight:700;box-shadow:0 0 20px rgba(255,61,158,.4)}
  .warn{border:1px solid #4A1226;background:#190611;border-radius:14px;padding:12px 14px;
        margin-bottom:12px;font-size:13px;color:#FF8FC4;line-height:1.5;display:none}

  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);z-index:40;
    background:linear-gradient(180deg,#0B1020,#06080F);border-left:1px solid var(--edge2);
    box-shadow:-30px 0 80px rgba(0,0,0,.6);transform:translateX(101%);
    transition:transform .42s var(--e);display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px) 16px}
  .drawer.open{transform:translateX(0)}
  .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .dhead h2{font-size:12px;letter-spacing:.2em;margin:0;color:var(--cyan)}
  .dhead button{width:42px;height:42px;border-radius:50%;border:1px solid var(--edge2);
                background:rgba(234,241,255,.05);font-size:17px}
  .scrim{position:fixed;inset:0;background:rgba(3,5,10,.6);z-index:39;opacity:0;pointer-events:none;
    transition:opacity .35s var(--e);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .scrim.open{opacity:1;pointer-events:auto}
  .tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding:0 0 8px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;white-space:nowrap;font-size:13.5px;color:var(--muted);
    background:rgba(234,241,255,.05);border:1px solid var(--edge);border-radius:100px;
    min-height:42px;padding:0 17px;transition:all .24s var(--e)}
  .tabs button.sel{background:linear-gradient(135deg,var(--cyan),#0E8BDD);color:#03121A;
    border-color:transparent;font-weight:700;
    box-shadow:0 0 26px rgba(47,231,255,.55),0 0 60px rgba(47,231,255,.2)}
  .listwrap{flex:1;overflow-y:auto;min-height:0;padding-right:4px}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;
       border-radius:15px;border:1px solid transparent;
       transition:background .24s var(--e),border-color .24s var(--e),transform .18s var(--e)}
  .row+.row{margin-top:3px}
  .row:active{transform:scale(.985)}
  .row:hover{background:rgba(234,241,255,.05)}
  .row .dot{width:9px;height:9px;border-radius:50%;flex:none;background:rgba(234,241,255,.14);
            transition:all .3s var(--e)}
  .row.play{background:linear-gradient(90deg,rgba(47,231,255,.16),rgba(47,231,255,.02));
    border-color:rgba(47,231,255,.45);
    box-shadow:0 0 26px rgba(47,231,255,.18),0 0 0 1px rgba(47,231,255,.1) inset}
  .row.play .dot{background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
  .row.play .nm{color:var(--cyan);text-shadow:0 0 16px rgba(47,231,255,.6)}
  .row.ok .dot{background:var(--lime);box-shadow:0 0 12px rgba(185,255,69,.55)}
  .row.ko{opacity:.3}
  .row .txt{flex:1;min-width:0}
  .row .line1{display:flex;align-items:center;gap:8px;min-width:0}
  .row .nm{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .txt span.desc{display:block;font-size:12.5px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sig{flex:none;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;
       padding:3px 8px;border-radius:99px;letter-spacing:.03em;
       border:1px solid currentColor;line-height:1.35}
  .sig.hi{color:#B9FF45;box-shadow:0 0 12px rgba(185,255,69,.35)}
  .sig.md{color:#2FE7FF;box-shadow:0 0 12px rgba(47,231,255,.3)}
  .sig.lo{color:#FFC24B;box-shadow:0 0 12px rgba(255,194,75,.3)}
  .sig.na{color:#8090B8;box-shadow:none}
  .row .star{font-size:19px;color:rgba(234,241,255,.2);padding:8px 6px;border-radius:10px;
             transition:all .22s var(--e);cursor:pointer}
  .row .star:hover{color:var(--magenta);transform:scale(1.15)}
  .row .star.is{color:var(--magenta);text-shadow:0 0 10px var(--magenta),0 0 22px rgba(255,61,158,.7)}
  .addrow{display:flex;gap:8px;margin-top:14px}
  .addrow .txtin{flex:1;min-width:0;border-radius:100px;min-height:50px;padding:0 18px}
  .pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
  .pager button{min-width:40px;min-height:40px;padding:0 10px;border-radius:12px;
    border:1px solid var(--edge);background:rgba(234,241,255,.04);color:var(--muted);
    font-size:14px;transition:all .2s var(--e)}
  .pager button.sel{background:var(--cyan);color:#03121A;border-color:transparent;font-weight:700;
                    box-shadow:0 0 20px rgba(47,231,255,.5)}
  .pager button[disabled]{opacity:.3}
  .pager .count{margin-left:auto;font-size:12px;color:var(--muted)}
  .msg{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}
  .msg b{color:var(--ice)} .msg.bad,.msg.bad b{color:var(--magenta)}
  .foot{color:#5C688C;font-size:11.5px;line-height:1.65;margin:16px 0 0}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(5,6,12,.84);
       -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
       border-top:1px solid var(--edge)}
  .bar-in{max-width:1700px;margin:0 auto;display:flex;align-items:center;gap:12px;
          padding:10px calc(env(safe-area-inset-right) + 14px)
                  calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px)}
  .bar .txt{flex:1;min-width:0}
  .bar .txt b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Le slider vertical — même confort qu'un slider horizontal :

<script>
(function(){

var CORE=[

];
var TABS=[
  {id:'all',label:'Tout'},{id:'fav',label:'Favoris'},
  {id:'jazz',label:'Jazz & soul'},{id:'dnb',label:'Drum & bass'},
  {id:'techno',label:'Techno & minimal'},{id:'house',label:'House & deep'},
  {id:'trance',label:'Trance & progressive'},{id:'dub',label:'Dub & monde'},
  {id:'ambient',label:'Ambiant & chill'},{id:'urban',label:'Hip-hop & funk'},
  {id:'retro',label:'Rétro & synthwave'},{id:'rock',label:'Rock & metal'}
];
var tab='all', health={}, query='', page=0, PER=10, online=[], seeking=false;

var favs=[], plays={};
try{ favs=JSON.parse(localStorage.getItem('tuner_favs')||'[]'); }catch(e){ favs=[]; }
try{ plays=JSON.parse(localStorage.getItem('tuner_plays')||'{}'); }catch(e){ plays={}; }

function bump(st){ plays[st.u]=(plays[st.u]||0)+1; savePlays(); renderTop5(); }
function renderTop5(){
  var card=document.getElementById('top5Card'), wrap=document.getElementById('top5List');
  if(!card||!wrap) return;
  var top=favs.filter(function(x){ return (plays[x.u]||0)>0; })
              .sort(function(a,b){ return (plays[b.u]||0)-(plays[a.u]||0); })
              .slice(0,5);
  if(!top.length){ card.style.display='none'; return; }
  card.style.display=''; wrap.innerHTML='';
  top.forEach(function(st,i){
    var b=document.createElement('button'); b.className='t5';
    if(current&&current.u===st.u) b.className+=' play';
    var n=(plays[st.u]||0);
    b.innerHTML='<span class="rk">'+(i+1)+'</span><span class="t5t"><span class="t5n"></span>'
               +'<span class="t5c">'+n+' écoute'+(n>1?'s':'')+'</span></span>';

}

/* ===================== Lecture ===================== */
var player=document.getElementById('player');
var current=null,plan=[],step=0,gen=0,wd=null,curEl=player,usingMix=false;
var npName=document.getElementById('npName'),npState=document.getElementById('npState'),
    barName=document.getElementById('barName'),barSub=document.getElementById('barSub'),
    eyebrow=document.getElementById('eyebrow'),wave=document.getElementById('wave'),
    power=document.getElementById('power'),power2=document.getElementById('power2'),
    listMsg=document.getElementById('listMsg'),favBtn=document.getElementById('fav');

function isPlaying(){ return !!(curEl&&!curEl.paused&&!curEl.ended); }
function silenceAll(except){
  [player,mixEl].forEach(function(el){
    if(!el||el===except) return;
    try{ el.pause(); }catch(e){}
    el.onerror=el.onplaying=el.onwaiting=el.onpause=null;
    try{ el.removeAttribute('src'); el.load(); }catch(e){}
  });
}
function render(state){
  var p=isPlaying();
  power.textContent=p?'Pause':(current?'Reprendre':'Écouter');
  power2.textContent=p?'❚❚':'▶';
  wave.classList.toggle('on',p); npState.classList.toggle('live',p);
  if(state!==undefined){ npState.textContent=state; barSub.textContent=state; }
  if(current) favBtn.classList.toggle('is',favs.some(function(x){return x.u===current.u;}));
}
function title(t){
  if(npName.textContent===t) return;
  npName.classList.add('swap');
  setTimeout(function(){ npName.textContent=t; npName.classList.remove('swap'); },170);
  barName.textContent=t;
}
['play','pause','playing','waiting','ended','stalled'].forEach(function(ev){
  player.addEventListener(ev,function(){ if(curEl===player) render(); });
});
function playStation(st){
  buildMix();
  current=st; step=0;
  plan=[];
  [st.u].concat(st.alts||[]).forEach(function(u){
    if(mixReady&&mixWanted) plan.push({u:via(u),mix:true});
    plan.push({u:u,mix:false});
  });
  eyebrow.textContent=st.local?'MA MUSIQUE':'RADIO';
  title(st.n); trackTitle(''); render('Connexion…'); paint(); session(st);
  var g=++gen; attempt(g);
  if(!st.local){ bump(st); pollTrack(st,g); } else { clearTimeout(trackTimer); }
}

var trackTimer=null, trackEl=document.getElementById('npTrack'), somaCache=null, somaCacheAt=0;
function trackTitle(t){
  trackEl.textContent=t||'';
  trackEl.classList.toggle('show',!!t);
}
function pollTrack(st,g){
  clearTimeout(trackTimer);
  if(!st.somaId) return;
  (function tick(){
    if(g!==gen) return;
    var now=Date.now();
    var ready=somaCache&&(now-somaCacheAt<15000) ? Promise.resolve(somaCache)
      : fetch('https://api.somafm.com/channels.json').then(function(r){return r.json();})
          .then(function(d){ somaCache=d; somaCacheAt=Date.now(); return d; });
    ready.then(function(d){
      if(g!==gen) return;
      var ch=(d.channels||[]).filter(function(c){ return c.id===st.somaId; })[0];
      trackTitle(ch&&ch.lastPlaying?ch.lastPlaying:'');
    }).catch(function(){});
    trackTimer=setTimeout(tick,20000);
  })();
}
function attempt(g){
  if(g!==gen) return;
  if(step>=plan.length){
    if(current) health[current.u]='dead';
    render('Cette station ne répond pas'); paint(); return;
  }
  var a=plan[step++], el=a.mix?mixEl:player;
  curEl=el; usingMix=a.mix;
  clearTimeout(wd); silenceAll(el);
  try{ el.pause(); }catch(e){}
  el.onerror=function(){ if(g===gen) attempt(g); };
  el.onwaiting=function(){ if(g===gen) render('Mise en mémoire…'); };
  el.onpause=function(){ if(g===gen) render('En pause'); };
  el.onplaying=function(){
    if(g!==gen) return;
    clearTimeout(wd);
    if(current) health[current.u]='alive';
    render(a.mix?'En direct · console active':'En direct · console sans effet ici');
    warn(!a.mix); paint();
    if(a.mix&&!current.local) checkMuted(g);
  };
  el.loop=!!(current&&current.local);
  el.src=a.u;
  var p=el.play(); if(p&&p.catch) p.catch(function(){});
  wd=setTimeout(function(){ if(g!==gen) return;
    if(el.paused||el.readyState<2) attempt(g); },12000);
}
function toggle(){
  if(isPlaying()){ try{ curEl.pause(); }catch(e){} render('En pause'); return; }
  if(current){ playStation(current); return; }
  playStation(rows()[0]||CORE[0]);
}
power.addEventListener('click',toggle); power2.addEventListener('click',toggle);
function session(st){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=new window.MediaMetadata({title:st.n,artist:st.g||'En direct'});
    navigator.mediaSession.setActionHandler('play',function(){ playStation(st); });
    navigator.mediaSession.setActionHandler('pause',function(){
      try{ curEl.pause(); }catch(e){} render('En pause'); });
  }catch(e){}
}

/* ===================== Chaîne audio complète ===================== */
var mixWanted=true,mixReady=false,mixEl=null,ctx=null,srcNode=null,noMix={},proxy='';
var eqLbass,eqLmid,eqLhigh,eqRbass,eqRmid,eqRhigh,gainL,gainR,chMerge;
var fx,dry,wet,delay,fb,comp,lim,master,splitter,anaL,anaR,dL,dR;
var anaLow,anaMid,anaHigh,bLow,bMid,bHigh;
function mixLive(){ return usingMix; }
function via(u){
  if(!proxy) return u;
  if(proxy.indexOf('{url}')>=0) return proxy.replace('{url}',encodeURIComponent(u));
  if(/[?&](url|u|target)=$/.test(proxy)) return proxy+encodeURIComponent(u);
  return proxy.replace(/\/+$/,'')+'/'+u;
}
function warn(on){
  panel.querySelector('[data-warn]').style.display=on?'block':'none';
}

function buildMix(){
  if(mixReady) return;
  var AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
  function eqNode(type,freq,Q){
    var f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(Q) f.Q.value=Q; return f;
  }

  /* ---- CHAÎNE STÉRÉO ----
     On ne splitte plus la source (les flux mono n'ont qu'un seul canal,
     le splitter laisse la voie droite silencieuse).
     À la place, on branche la source DIRECTEMENT sur les deux chaînes
     EQ L et R, puis on fusionne dans chMerge. Le signal mono se
     duplique naturellement sur L et R par le câblage. */

  /* Deux chaînes d'égalisation indépendantes — 3 bandes chacune */
  eqLbass =eqNode('lowshelf', 200);
  eqLmid  =eqNode('peaking', 1000, .9);
  eqLhigh =eqNode('highshelf', 10000);
  eqRbass =eqNode('lowshelf', 200);
  eqRmid  =eqNode('peaking', 1000, .9);
  eqRhigh =eqNode('highshelf', 10000);
  gainL=ctx.createGain(); gainR=ctx.createGain();
  chMerge=ctx.createChannelMerger(2);

  fx   =ctx.createBiquadFilter(); fx.type='allpass'; fx.frequency.value=1000; fx.Q.value=1;
  dry  =ctx.createGain(); dry.gain.value=1;
  wet  =ctx.createGain(); wet.gain.value=0;
  delay=ctx.createDelay(2.0); delay.delayTime.value=.25;
  fb   =ctx.createGain(); fb.gain.value=0;
  comp =ctx.createDynamicsCompressor();
  comp.threshold.value=0; comp.ratio.value=1; comp.knee.value=18;
  comp.attack.value=.006; comp.release.value=.2;
  lim  =ctx.createDynamicsCompressor();
  lim.threshold.value=-1; lim.ratio.value=20; lim.knee.value=0;
  lim.attack.value=.001; lim.release.value=.08;
  master=ctx.createGain();

  /* Créer la source audio AVANT le câblage */
  mixEl=new Audio(); mixEl.crossOrigin='anonymous'; mixEl.setAttribute('playsinline','');
  ['play','pause','playing','waiting','ended','stalled'].forEach(function(ev){
    mixEl.addEventListener(ev,function(){ if(curEl===mixEl) render(); });
  });
  srcNode=ctx.createMediaElementSource(mixEl);

  /* Câblage : srcNode → EQ L → gainL → chMerge[0] (L)
                       ↘ EQ R → gainR → chMerge[1] (R)
     Connecter la source sur les deux chaînes duplique naturellement
     un signal mono sur les deux voies, sans passer par un splitter. */
  srcNode.connect(eqLbass); eqLbass.connect(eqLmid);
  eqLmid.connect(eqLhigh);
  eqLhigh.connect(gainL); gainL.connect(chMerge,0,0);
  srcNode.connect(eqRbass); eqRbass.connect(eqRmid);
  eqRmid.connect(eqRhigh);
  eqRhigh.connect(gainR); gainR.connect(chMerge,0,1);

  chMerge.connect(fx);
  fx.connect(dry); dry.connect(comp);
  fx.connect(delay); delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(comp);
  comp.connect(lim); lim.connect(master); master.connect(ctx.destination);

  splitter=ctx.createChannelSplitter(2);
  master.connect(splitter);
  anaL=ctx.createAnalyser(); anaR=ctx.createAnalyser();
  anaL.fftSize=1024; anaR.fftSize=1024;
  splitter.connect(anaL,0); splitter.connect(anaR,1);
  dL=new Uint8Array(anaL.fftSize); dR=new Uint8Array(anaR.fftSize);

  function band(type,freq,Q){
    var f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(Q) f.Q.value=Q;
    var a=ctx.createAnalyser(); a.fftSize=2048; a.smoothingTimeConstant=.45;
    master.connect(f); f.connect(a); return a;
  }
  anaLow=band('lowpass',180); anaMid=band('bandpass',1100,.7); anaHigh=band('highpass',3800);
  bLow=new Uint8Array(anaLow.fftSize); bMid=new Uint8Array(anaMid.fftSize); bHigh=new Uint8Array(anaHigh.fftSize);

  ctx.resume(); mixReady=true; applyAudio();
}
function checkMuted(g){
  var tries=0,best=0;
  (function probe(){
    if(g!==gen||!anaL||!anaR||!mixEl||mixEl.paused) return;
    anaL.getByteTimeDomainData(dL); anaR.getByteTimeDomainData(dR);
    var peak=0;
    for(var i=0;i<dL.length;i+=4){ var d=Math.abs(dL[i]-128); if(d>peak) peak=d; }
    for(var j=0;j<dR.length;j+=4){ var e=Math.abs(dR[j]-128); if(e>peak) peak=e; }
    if(peak>best) best=peak;
    if(best>3) return;
    if(++tries<12){ setTimeout(probe,500); return; }
    attempt(g);
  })();
}

function fmt(s,v){
  switch(s){
    case 'db':  return (v>0?'+':'')+v.toFixed(1)+' dB';
    case 'db0': return v.toFixed(0)+' dB';
    case 'ms':  return Math.round(v)+' ms';
    case 'pc':  return Math.round(v)+' %';
    case 'x':   return v.toFixed(1)+':1';
    case 'hz':  var f=freqFromPos(v);
                return f>=1000?(f/1000).toFixed(1).replace('.',',')+' kHz':Math.round(f)+' Hz';
  }
  return v;
}
var FMT={gain:'db',volL:'db',volR:'db',
         subL:'db',bassL:'db',midL:'db',himidL:'db',highL:'db',
         subR:'db',bassR:'db',midR:'db',himidR:'db',highR:'db'};
MODS.forEach(function(m){ m.items.forEach(function(s){ if(s.fmt) FMT[s.k]=s.fmt; }); });

function syncUI(){
  panel.querySelectorAll('[data-k]').forEach(function(i){
    var k=i.dataset.k;
    if(i.tagName==='SELECT'){ if(i.value!==P[k]) i.value=P[k]; return; }
    if(parseFloat(i.value)!==P[k]) i.value=P[k];
    var mn=+i.min,mx=+i.max,pct=((P[k]-mn)/(mx-mn)*100);
    /* Les sliders verticaux (.eq-band input) ont leur track inversé (to top) */
    i.style.setProperty('--p',pct+'%');
  });
  panel.querySelectorAll('[data-val]').forEach(function(s){
    var v=P[s.dataset.val];
    /* Affichage compact pour les valeurs EQ dans les petites étiquettes */
    s.textContent = (s.classList.contains('eq-val'))
      ? (v===0?'0':(v>0?'+':'')+v.toFixed(0))
      : fmt(FMT[s.dataset.val],v);
  });
  panel.querySelectorAll('[data-preset]').forEach(function(b){
    b.classList.toggle('sel',b.dataset.preset===preset);
  });
}

function applyAudio(){
  if(!ctx){ syncUI(); return; }
  var t=ctx.currentTime, R=function(p,v){
    p.cancelScheduledValues(t); p.setValueAtTime(p.value,t); p.linearRampToValueAtTime(v,t+.035); };
  R(eqLsub.gain,P.subL); R(eqLbass.gain,P.bassL); R(eqLmid.gain,P.midL);
  R(eqLhimid.gain,P.himidL); R(eqLhigh.gain,P.highL);
  R(eqRsub.gain,P.subR); R(eqRbass.gain,P.bassR); R(eqRmid.gain,P.midR);
  R(eqRhimid.gain,P.himidR); R(eqRhigh.gain,P.highR);
  /* À -12 dB (minimum du fader) on coupe complètement le canal */
  R(gainL.gain, P.volL<=-12 ? 0 : Math.pow(10,P.volL/20));
  R(gainR.gain, P.volR<=-12 ? 0 : Math.pow(10,P.volR/20));
  if(P.ftype==='none'){ fx.type='allpass'; R(fx.frequency,1000); }
  else { fx.type=P.ftype; R(fx.frequency,freqFromPos(P.ffreq));
         fx.Q.value=(P.ftype==='bandpass'||P.ftype==='notch')?2:1; }
  R(delay.delayTime,P.dtime/1000);
  R(fb.gain,P.dfb/100);
  R(wet.gain,P.dfb>0?Math.min(.5,P.dfb/100+.12):0);
  R(dry.gain,1);
  R(comp.threshold,P.cthr); R(comp.ratio,P.cratio);
  R(lim.threshold,P.limit);
  R(master.gain,Math.pow(10,P.gain/20));
}

      return (s.n+' '+(s.g||'')+' '+label(s.c)).toLowerCase().indexOf(q)>=0;

           : CORE.filter(function(s){ return tab==='all'||s.c===tab; });

               +'<span class="star'+(isFav?' is':'')+'">★</span>';

    listEl.appendChild(r);
  });
  renderTop5();
}
function drawPager(pages,total){
  var p=document.getElementById('pager');
  if(pages<=1){ p.innerHTML = total? '<span class="count">'+total+' station'+(total>1?'s':'')+'</span>' : ''; return; }
  var h='<button data-pg="prev" '+(page===0?'disabled':'')+'>‹</button>';
  for(var i=0;i<pages;i++) h+='<button data-pg="'+i+'" class="'+(i===page?'sel':'')+'">'+(i+1)+'</button>';
  h+='<button data-pg="next" '+(page===pages-1?'disabled':'')+'>›</button>'
   +'<span class="count">'+total+' stations</span>';
  p.innerHTML=h;
  p.querySelectorAll('[data-pg]').forEach(function(b){
    b.addEventListener('click',function(){
      var v=b.dataset.pg;
      page = v==='prev' ? page-1 : v==='next' ? page+1 : parseInt(v,10);
      paint();
      var lw=document.querySelector('.listwrap'); if(lw) lw.scrollTop=0;
    });
  });
}
var searchTimer=null;
document.getElementById('search').addEventListener('input',function(){
  query=this.value.trim(); page=0; paint();
  clearTimeout(searchTimer);
  if(query.length<2){ online=[]; return; }
  searchTimer=setTimeout(function(){ library(query); },450);
});

function library(q){
  seeking=true;
  listMsg.className='msg';
  listMsg.innerHTML='<b>Recherche dans la bibliothèque…</b>';
  var base='https://de1.api.radio-browser.info/json/stations/search?hidebroken=true'
          +'&order=clickcount&reverse=true&limit=60&';
  Promise.all([
    fetch(base+'tag='+encodeURIComponent(q)).then(function(r){return r.json();}).catch(function(){return [];}),
    fetch(base+'name='+encodeURIComponent(q)).then(function(r){return r.json();}).catch(function(){return [];})
  ]).then(function(sets){
    if(query!==q) return;
    var have={}, out=[];
    CORE.forEach(function(x){ have[x.u]=1; });
    sets.forEach(function(rowsIn){
      (rowsIn||[]).forEach(function(r){
        var u=r.url_resolved||r.url;
        if(!u||u.indexOf('https://')!==0||have[u]) return;
        have[u]=1;
        var tags=(r.tags||'').split(',').filter(Boolean).slice(0,3).join(', ');
        out.push({
          n:(r.name||'').trim().slice(0,46)||'Sans nom',
          g:[tags, r.country||'', (r.codec||'').toUpperCase()].filter(Boolean).join(' · '),
          q:(r.bitrate?r.bitrate+' kbps':''), c:'web', u:u, alts:[], web:true
        });
      });
    });
    online=out; seeking=false;
    listMsg.className='msg';
    listMsg.innerHTML = out.length
      ? '<b>'+out.length+' stations trouvées dans la bibliothèque.</b> Elles ne sont pas filtrées : '
        +'certaines diffusent de la publicité.'
      : '<b>Rien dans la bibliothèque pour ce mot.</b> Essaie un genre plus courant : techno, dub, jazz.';
    paint();
  }).catch(function(){
    seeking=false;
    listMsg.className='msg bad';
    listMsg.innerHTML='<b>La bibliothèque est injoignable depuis cette page.</b> '
                     +'Elle répond une fois le site ouvert en ligne.';
  });
}
function toggleFav(st){
  var i=favs.findIndex(function(x){ return x.u===st.u; });
  if(i>=0) favs.splice(i,1); else favs.push(st);
  saveFavs(); render(); paint();
}
favBtn.addEventListener('click',function(){ if(current) toggleFav(current); });
document.getElementById('addUrl').addEventListener('click',function(){
  var box=document.getElementById('url'), u=box.value.trim(); if(!u) return;
  if(u.indexOf('http')!==0) u='https://'+u;
  CORE.push({n:u.replace(/^https?:\/\//,'').split('/')[0],g:'Flux ajouté',
             c:tab==='fav'?'all':tab,q:'',u:u,alts:[]});
  box.value=''; box.blur(); playStation(CORE[CORE.length-1]);
});

/* ===================== Onde, VU, oscilloscope ===================== */
var bars=[];
for(var i=0;i<34;i++){ var e=document.createElement('i'); wave.appendChild(e); bars.push(e); }
var cv=document.getElementById('scope'), cx=cv.getContext('2d'), dpr=1;
function sizeCanvas(){ dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr; }
window.addEventListener('resize',sizeCanvas);
setTimeout(sizeCanvas,0); sizeCanvas();

function trace(buf,color,scale,alpha){
  var W=cv.width,H=cv.height,n=buf.length,mid=H/2;
  var path=new Path2D();
  for(var i=0;i<n;i+=2){
    var x=i/n*W, y=mid+((buf[i]-128)/128)*(H*scale);
    if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
  }
  cx.lineJoin='round'; cx.lineCap='round'; cx.strokeStyle=color; cx.shadowColor=color;
  cx.globalAlpha=alpha*.22; cx.lineWidth=9*dpr;   cx.shadowBlur=34*dpr; cx.stroke(path);
  cx.globalAlpha=alpha*.5;  cx.lineWidth=4.5*dpr; cx.shadowBlur=18*dpr; cx.stroke(path);
  cx.globalAlpha=alpha;     cx.lineWidth=1.8*dpr; cx.shadowBlur=8*dpr;  cx.stroke(path);
  cx.globalAlpha=1; cx.shadowBlur=0;
}
function rms(buf){
  var s=0; for(var i=0;i<buf.length;i+=2){ var d=(buf[i]-128)/128; s+=d*d; }
  return Math.sqrt(s/(buf.length/2));
}
var idle=0;
(function loop(){
  requestAnimationFrame(loop);
  var playing=isPlaying(), live=playing&&mixLive()&&anaLow;

  if(live){
    anaLow.getByteTimeDomainData(bLow);
    anaMid.getByteTimeDomainData(bMid);
    anaHigh.getByteTimeDomainData(bHigh);
    anaL.getByteTimeDomainData(dL); anaR.getByteTimeDomainData(dR);
    for(var k=0;k<bars.length;k++){
      bars[k].style.height=Math.max(3,Math.abs(bMid[k*26+40]-128)/128*44)+'px';
    }
    var lv=[rms(dL),rms(dR)];
    ['L','R'].forEach(function(side,n){
      var segs=panel.querySelectorAll('[data-vu="'+side+'"] i');
      var on=Math.round(Math.min(1,lv[n]*3.4)*segs.length);
      for(var s=0;s<segs.length;s++){
        var lit=s<on, col=s>16?'#FF3D9E':(s>12?'#FFC24B':'#B9FF45');
        segs[s].style.background=lit?col:'rgba(234,241,255,.07)';
        segs[s].style.boxShadow=lit?'0 0 9px '+col:'none';
      }
    });
    var red=lim?lim.reduction:0;
    var led=panel.querySelector('[data-led]');
    if(led) led.classList.toggle('hot',(typeof red==='number'?red:0)<-.6);
  } else {
    idle+=.045;
    for(var j=0;j<bars.length;j++){
      bars[j].style.height=playing?(9+Math.sin(idle+j*.38)*7+Math.sin(idle*1.8+j)*3)+'px':'3px';
    }
  }

  cx.clearRect(0,0,cv.width,cv.height);
  cx.strokeStyle='rgba(140,190,255,.16)'; cx.lineWidth=1*dpr;
  cx.shadowColor='rgba(47,231,255,.7)'; cx.shadowBlur=10*dpr;
  cx.beginPath(); cx.moveTo(0,cv.height/2); cx.lineTo(cv.width,cv.height/2); cx.stroke();
  cx.shadowBlur=0;
  if(live){
    trace(bLow ,'#FF3D9E',.34,.95);
    trace(bMid ,'#2FE7FF',.30,.9);
    trace(bHigh,'#B9FF45',.26,.85);
  } else {
    ['#FF3D9E','#2FE7FF','#B9FF45'].forEach(function(c,n){
      var p=new Path2D();
      for(var x=0;x<cv.width;x+=4){
        var yy=cv.height/2+Math.sin(x/(60+n*22)+idle*(1+n*.35)+n*2)*(playing?12:5)*dpr;
        if(x===0) p.moveTo(x,yy); else p.lineTo(x,yy);
      }
      cx.lineJoin='round'; cx.lineCap='round'; cx.strokeStyle=c; cx.shadowColor=c;
      cx.globalAlpha=.16; cx.lineWidth=9*dpr;   cx.shadowBlur=30*dpr; cx.stroke(p);
      cx.globalAlpha=.42; cx.lineWidth=4*dpr;   cx.shadowBlur=16*dpr; cx.stroke(p);
      cx.globalAlpha=.85; cx.lineWidth=1.6*dpr; cx.shadowBlur=7*dpr;  cx.stroke(p);
      cx.globalAlpha=1; cx.shadowBlur=0;
    });
  }
})();

/* ===================== Tiroir des stations ===================== */
var drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function openDrawer(o){ drawer.classList.toggle('open',o); scrim.classList.toggle('open',o); }
document.getElementById('openDrawer').addEventListener('click',function(){ openDrawer(true); });
document.getElementById('closeDrawer').addEventListener('click',function(){ openDrawer(false); });
scrim.addEventListener('click',function(){ openDrawer(false); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') openDrawer(false); });

/* ===================== Partage de l'espace ===================== */
(function(){
  var grip=document.getElementById('grip'), dragging=false, startY=0, startH=0;
  function height(){ return document.getElementById('scope').getBoundingClientRect().height; }
  function begin(y){ dragging=true; startY=y; startH=height(); grip.classList.add('drag');
                     document.body.style.userSelect='none'; }
  function move(y){
    if(!dragging) return;
    var h=Math.max(120,Math.min(window.innerHeight*0.72,startH+(y-startY)));
    document.documentElement.style.setProperty('--scopeH',h+'px');
    sizeCanvas();
  }
  function end(){ dragging=false; grip.classList.remove('drag'); document.body.style.userSelect=''; }
  grip.addEventListener('mousedown',function(e){ begin(e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove',function(e){ move(e.clientY); });
  window.addEventListener('mouseup',end);
  grip.addEventListener('touchstart',function(e){ begin(e.touches[0].clientY); },{passive:true});
  grip.addEventListener('touchmove',function(e){ move(e.touches[0].clientY); e.preventDefault(); },{passive:false});
  grip.addEventListener('touchend',end);
  grip.addEventListener('dblclick',function(){
    document.documentElement.style.setProperty('--scopeH','30vh'); sizeCanvas();
  });
})();

document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
syncUI(); paint(); render('Ouvre les stations pour choisir');
})();
